<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2>Contoh If - else</h2>
    
    <script>
        let nilai = prompt("Berapa nilai UTS anda?" , 0);
        nilai = parseInt(nilai);

        if (nilai >= 56) {
            document.write("<p>Nilai anda " + nilai + ": Lulus</p>");
        } else {
            document.write("<p>Nilai anda" + nilai + ": Tidak lulus</p>");
        }
    </script>
</body>
</html>
